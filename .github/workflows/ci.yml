name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  e2e:
    name: Build & E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Build images
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml build

      - name: Start stack
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml up -d

      - name: Wait for app
        run: until curl -sf http://localhost:8081/login >/dev/null 2>&1; do sleep 3; done

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install JS deps
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Reset e2e database
        run: bash tests/e2e/reset-db.sh

      - name: Run E2E suite
        run: npx playwright test --reporter=line

      - name: Upload trace on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7

      - name: Tear down stack
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml down -v

  publish:
    name: Publish image (GHCR)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          target: php-runtime
          push: true
          tags: |
            ghcr.io/ravlyr/cadastral-management-system:latest
            ghcr.io/ravlyr/cadastral-management-system:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
