services:
  app:
    build:
      context: .
      target: php-runtime
    container_name: laravel_app
    restart: unless-stopped
    ports:
      - "8080:80"
    env_file:
      - .env.prod
    volumes:
      - app_storage:/var/www/storage/app
    depends_on:
      - postgis

  postgis:
    image: postgis/postgis:16-3.4
    container_name: postgis_prod
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-buku_c_temurejo_prod}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  app_storage:
  postgres_data:
