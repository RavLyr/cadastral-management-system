# Cloudflared Tunnel — Buku C Digital
# Jalankan `cloudflared` di mesin yang menjalankan stack produksi (port 8080).
# Config ini identik untuk lokal (testing) dan VPS -> migrasi = pindahkan folder ini.

tunnel: buku-c
credentials-file: /etc/cloudflared/buku-c.json

ingress:
  - hostname: app.ravlyr.my.id
    service: http://localhost:8080
  - service: http_status:404
