version: '3.8'

services:
  app:
    build:
      context: .
      target: php-runtime
    container_name: laravel_app_local
    restart: unless-stopped
    ports:
      - "8080:80"
    env_file:
      - .env.local
    depends_on:
      - db
      - postgis

  db:
    image: mysql:8
    container_name: mysql_local
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: buku_c_temurejo
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql

  postgis:
    image: postgis/postgis:16-3.4
    container_name: postgis_local
    restart: unless-stopped
    environment:
      POSTGRES_DB: buku_c_temurejo
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  db_data:
  postgres_data:
